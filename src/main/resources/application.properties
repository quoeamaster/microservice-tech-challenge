server.port=${PORT:9081}

# SQLite database file, created automatically on first start (the data/ folder is created too).
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=${DB_URL:jdbc:sqlite:data/pets.db}
# SQLite allows one writer at a time; a single connection avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1

# Run schema.sql on every start (it only uses CREATE ... IF NOT EXISTS).
spring.sql.init.mode=always

# Timeouts for calls to the picture APIs, so a slow or dead API can't hang a request.
photos.connect-timeout=5s
photos.read-timeout=10s

# Browser origins allowed to call /api/** (for a UI hosted elsewhere; the built-in UI doesn't need it).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
